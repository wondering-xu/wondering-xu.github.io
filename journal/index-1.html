<script>
// 日历动态渲染函数
function buildCalendar(year, month, activeDays, targetId) {
  const container = document.getElementById(targetId);
  if (!container) return;

  const firstDay = new Date(year, month - 1, 1).getDay(); // 当月第一天是周几
  const totalDays = new Date(year, month, 0).getDate();  // 当月总天数
  
  let html = '<div class="cal-header">';
  ['日', '一', '二', '三', '四', '五', '六'].forEach(d => html += `<span>${d}</span>`);
  html += '</div><div class="cal-body">';

  // 填充月初前的空格
  for (let i = 0; i < firstDay; i++) {
    html += '<span class="cal-day empty"></span>';
  }

  // 渲染 1号 到 当月最后一天
  for (let day = 1; day <= totalDays; day++) {
    const dayStr = day < 10 ? '0' + day : day;
    const dateKey = `${year}-${String(month).padStart(2, '0')}-${dayStr}`;

    if (activeDays.includes(dayStr)) {
      // 如果当天有日记，生成带有锚点 #entry-YYYY-MM-DD 的跳转链接
      html += `<a href="#entry-${dateKey}" class="cal-day has-entry" title="查看 ${day} 日日记">${day}</a>`;
    } else {
      html += `<span class="cal-day">${day}</span>`;
    }
  }

  html += '</div>';
  container.innerHTML = html;
}

// 页面加载完成后自动绘制日历
document.addEventListener("DOMContentLoaded", function() {
  // 配置 2026年9月 有日记的日期（填入日期数，如 ["03", "24"]）
  buildCalendar(2026, 9, ["03", "24"], "cal-2026-09");
});
</script>
